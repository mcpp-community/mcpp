# version — what a version IS, and how two of them compare.
#
# Two modules that look unrelated and are not: `mcpp.version` is this binary's
# own identity, `mcpp.version_req` is the SemVer grammar every OTHER package's
# version is read with. They ship together because a release moves both and
# because separating them would put one constant in a package of its own.
#
# `MCPP_VERSION` here is one of two version sites checked against each other
# by `.github/tools/check_version_pins.sh`; the other is the root `mcpp.toml`.
# Moving this file means moving that check's path, which is why the check reads
# it by path rather than by glob.
[package]
name        = "versioning"
namespace   = "mcpp"
version     = "0.1.0"
description = "This binary's version, and SemVer requirement parsing"
license     = "Apache-2.0"

# NAMED `versioning`, NOT `version`. `version` is a reserved key inside a
# dependency specification, so `[dependencies.mcpp] version = { path = … }`
# parses as "the mcpp dependency's version field" and fails with
# `must specify 'path', 'version', or 'git'` -- an error about the wrong table.

# Subsystem-level tests. They see only this package, which is what lets them
# state its contract in isolation; the root `tests/unit/` states the same facts
# as the engine consumes them, and the pair is the cross-check.
[dev-dependencies.compat]
gtest = "1.15.2"
