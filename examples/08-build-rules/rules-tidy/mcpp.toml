[package]
name        = "rules-tidy"
namespace   = "example"
version     = "0.1.0"
description = "Per-file source analysis as build-graph nodes (role = check)"
license     = "Apache-2.0"

# This rule reuses another rule rather than copying it. The rule's library
# imports `example.rules.embed`, so the package is one of its [dependencies]:
# a build plugin's dependencies are compiled with it for the build program
# that uses it.
[dependencies]
example.rules-embed = { path = "../rules-embed" }
