[package]
name        = "rules-toy"
namespace   = "example"
version     = "0.1.0"
description = "A rule package that teaches mcpp a device language the engine has never heard of"
license     = "Apache-2.0"

# THE TWO KEYS THAT MAKE A NEW DEVICE LANGUAGE COST NO ENGINE RELEASE.
#
# `device_extensions` says which sources this rule compiles. A consumer that
# activates the feature gets `.toy` classified as a DEVICE source: never scanned
# for imports, never producing a BMI, and refused if no action claims it.
#
# `rule_module` says which module the consumer's build program imports to reach
# the rule. It also implies `host-module = true`, so a consumer writes the
# feature and nothing else.
#
# `.toy` is not in the engine's built-in table and never will be. The engine
# knows what a device source IS; it does not know that `.toy` is anything.
[features]
default = []

[features.rules-toy]
sources           = ["src/rules-toy.cppm"]
rule_module       = "example.rules.toy"
device_extensions = [".toy"]
