[package]
name        = "lib-consume"
version     = "0.1.0"
description = "Demo: consuming a prebuilt library package three different ways"
license     = "Apache-2.0"

# A packed library is an ordinary package: a path dependency, a file, or an
# index entry all reach it the same way. Point this at whatever
# `mcpp pack mathkit` produced under ../05-lib-dist/target/dist/.
[dependencies]
mathkit = { path = "../05-lib-dist/target/dist/mathkit-0.1.0-x86_64-linux-gnu-gcc16-libstdcxx16-c++23" }

[targets.consume-header]
kind = "bin"
main = "src/main_header.cpp"

[targets.consume-module]
kind = "bin"
main = "src/main_module.cpp"

[targets.consume-both]
kind = "bin"
main = "src/main_both.cpp"
