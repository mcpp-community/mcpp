[package]
name        = "mbench"
version     = "0.1.0"
description = "Build-engine benchmark harness — cross-platform, engine-agnostic, protocol-versioned"
license     = "Apache-2.0"
authors     = ["mcpp-community"]

[build]
default-profile = "release"

# The harness must build on a machine that has nothing but mcpp: it is the first
# thing that runs when measuring a fresh environment, so it takes no
# dependencies beyond `import std;`.
[toolchain]
default = "gcc@16.1.0"
macos   = "llvm@23.1.3"
windows = "llvm@23.1.3"

# THE ENGINE'S OWN COSTS AS METRICS WITH A HISTORY (tests/engine.cpp, design
# 2026-11-10 §16): mtest Bench cases that time the mcpp under test (MCPP) on a
# small fixture. `mcpp build` ignores [dev-dependencies], so the harness itself
# still takes nothing beyond `import std;`.
[dev-dependencies]
mcpplibs.mtest = "0.5.2"
