name: probe (openkal as the os substrate, do not merge)

# What openkal answers inside an ordinary hosted program on each platform and
# toolchain the os library's first consumers use. The probe prints facts and
# never asserts; the summary carries every PROBE line.
on:
  pull_request:
  workflow_dispatch:

env:
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64 gcc dev,      runner: ubuntu-24.04,     args: '' }
          - { name: linux-x86_64 gcc release,  runner: ubuntu-24.04,     args: '--release' }
          - { name: linux-x86_64 llvm,         runner: ubuntu-24.04,     args: '--toolchain llvm@23.1.3' }
          - { name: linux-x86_64 musl static,  runner: ubuntu-24.04,     args: '--target x86_64-linux-musl --release' }
          - { name: linux-aarch64 default,     runner: ubuntu-24.04-arm, args: '' }
          - { name: macos-arm64 llvm,          runner: macos-15,         args: '--toolchain llvm@23.1.3' }
          - { name: macos-arm64 llvm release,  runner: macos-15,         args: '--toolchain llvm@23.1.3 --release' }
          - { name: windows-x64 llvm (msvc abi), runner: windows-2022,   args: '--toolchain llvm@23.1.3' }
          - { name: windows-x64 msvc (cl.exe),   runner: windows-2022,   args: '--toolchain msvc' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-mcpp
      - name: Build the probe
        working-directory: .github/probe/okprobe
        run: |
          set -o pipefail
          "$MCPP" build ${{ matrix.args }} 2>&1 | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the probe
        working-directory: .github/probe/okprobe
        run: |
          set -o pipefail
          B=$(find target -type f \( -name okprobe -o -name okprobe.exe \) -path '*/bin/*' | head -1)
          echo "binary: $B"
          { echo '```'; timeout 300 "$B" 2>&1; echo "exit=$?"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
