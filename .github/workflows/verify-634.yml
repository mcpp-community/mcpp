# TEMPORARY. Measurements behind the #634 design record
# (.agents/docs/2026-09-14-634-cmake-parity-items-by-home.md). This branch
# carries no other workflow and is not for merging: each job records what one
# platform does (READING lines, the step summary, an artifact of logs) and
# fails only when a probe cannot run at all.
name: verify-634 (temporary measurements)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-634-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_NON_INTERACTIVE: "1"

jobs:
  macos:
    name: macos-15 (M1 M4 M5 M2-ios B1 B2 B3)
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Pin MCPP_HOME
        run: echo "MCPP_HOME=$HOME/.mcpp" >> "$GITHUB_ENV"
      - name: Fetch the released mcpp
        run: bash .github/verify-634/setup-mcpp.sh
      - name: M1 B1 B2 - Mach-O staged closure, Frameworks bundle, DMG
        run: bash .github/verify-634/macos-closure-bundle.sh 2>&1 | tee "$RUNNER_TEMP/macos-closure-bundle.log"
      - name: M4 B3 - main bundle resolution, named runner, default runner
        run: bash .github/verify-634/macos-runner.sh 2>&1 | tee "$RUNNER_TEMP/macos-runner.log"
      - name: M5 - simctl launch spellings
        run: bash .github/verify-634/macos-simctl.sh 2>&1 | tee "$RUNNER_TEMP/macos-simctl.log"
      - name: M2 - mcpp test on the iOS simulator
        run: bash .github/verify-634/macos-ios-test.sh 2>&1 | tee "$RUNNER_TEMP/macos-ios-test.log"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-634-macos
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/m1/**/*.log
            ${{ runner.temp }}/m1/*.txt
            ${{ runner.temp }}/m1/*.out
            ${{ runner.temp }}/m4/**/*.out
            ${{ runner.temp }}/m4/**/*.log
            ${{ runner.temp }}/m2ios/**/*.json
            ${{ runner.temp }}/m2ios/**/*.err
          if-no-files-found: warn

  android:
    name: ubuntu-24.04 emulator (M2-android)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Pin MCPP_HOME
        run: echo "MCPP_HOME=$HOME/.mcpp" >> "$GITHUB_ENV"
      - name: Fetch the released mcpp
        run: bash .github/verify-634/setup-mcpp.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: M2 - compile the tests before the emulator starts
        run: bash .github/verify-634/android-test.sh prebuild 2>&1 | tee "$RUNNER_TEMP/android-prebuild.log"
      - name: M2 - mcpp test on an API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/verify-634/android-test.sh run 2>&1 | tee "$RUNNER_TEMP/android-run.log"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-634-android
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/m2android/**/*.json
            ${{ runner.temp }}/m2android/**/*.err
          if-no-files-found: warn

  linux:
    name: ubuntu-24.04 fresh homes (M3 M7)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the released mcpp
        run: bash .github/verify-634/setup-mcpp.sh
      - name: M3 - the SubOS pkg-config view with only xim:gtk4 declared
        run: bash .github/verify-634/linux-gtk-view.sh 2>&1 | tee "$RUNNER_TEMP/linux-gtk-view.log"
      - name: M7 - an xim index override from a branch checkout
        run: bash .github/verify-634/linux-index-override.sh 2>&1 | tee "$RUNNER_TEMP/linux-index-override.log"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-634-linux
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/m3/**/*.log
            ${{ runner.temp }}/m7/**/*.log
          if-no-files-found: warn

  windows:
    name: windows-2022 (M6)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Pin MCPP_HOME in the host's path syntax
        run: |
          H="$HOME/.mcpp"
          command -v cygpath >/dev/null && H=$(cygpath -m "$H")
          echo "MCPP_HOME=$H" >> "$GITHUB_ENV"
      - name: Fetch the released mcpp
        run: bash .github/verify-634/setup-mcpp.sh
      - name: M6 - WiX native SDK archives under mcpp's Windows toolchains
        run: bash .github/verify-634/windows-wix-link.sh 2>&1 | tee "$RUNNER_TEMP/windows-wix-link.log"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-634-windows
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/m6/**/*.log
          if-no-files-found: warn
