# TEMPORARY. Measurements behind the #634 design record
# (.agents/docs/2026-09-14-634-cmake-parity-items-by-home.md). This branch
# carries no other workflow and is not for merging: each job records what one
# platform does as READING lines in its log and step summary, and fails only
# when a probe cannot run at all.
#
# Run 4 keeps only B1's last question: why an rpath edit of an mcpp-built
# program fails, and whether a Frameworks bundle loads through a link-time
# rpath or through an edit of a program linked with header padding. The other
# jobs' readings are final and recorded in the design record; their scripts
# stay on the branch.
name: verify-634 (temporary measurements)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-634-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_NON_INTERACTIVE: "1"

jobs:
  macos-bundle-rpath:
    name: macos-15 bundle rpath (B1 run 4)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Pin MCPP_HOME
        run: echo "MCPP_HOME=$HOME/.mcpp" >> "$GITHUB_ENV"
      - name: Fetch the released mcpp
        timeout-minutes: 10
        run: bash .github/verify-634/setup-mcpp.sh
      - name: B1 - link-time rpath, header padding, rpath edit
        timeout-minutes: 40
        run: bash .github/verify-634/macos-bundle-rpath.sh 2>&1
