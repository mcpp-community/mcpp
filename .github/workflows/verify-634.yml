# TEMPORARY. Measurements behind the #634 design record
# (.agents/docs/2026-09-14-634-cmake-parity-items-by-home.md). This branch
# carries no other workflow and is not for merging: each job records what one
# platform does as READING lines in its log and step summary, and fails only
# when a probe cannot run at all.
#
# Run 3 keeps only the two questions runs 1 and 2 left open: the Frameworks
# bundle with a literal rpath (the link-time one is anchored by the engine),
# and the simulator's exit status. The other jobs' readings are final and
# recorded in the design record; their scripts stay on the branch.
name: verify-634 (temporary measurements)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-634-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_NON_INTERACTIVE: "1"

jobs:
  macos-bundle:
    name: macos-15 bundle (M1 B1 B2)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Pin MCPP_HOME
        run: echo "MCPP_HOME=$HOME/.mcpp" >> "$GITHUB_ENV"
      - name: Fetch the released mcpp
        timeout-minutes: 10
        run: bash .github/verify-634/setup-mcpp.sh
      - name: M1 B1 B2 - Mach-O staged closure, Frameworks bundle, DMG
        timeout-minutes: 40
        run: bash .github/verify-634/macos-closure-bundle.sh 2>&1

  macos-sim-status:
    name: macos-15 simulator status (M5 run 3)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Pin MCPP_HOME
        run: echo "MCPP_HOME=$HOME/.mcpp" >> "$GITHUB_ENV"
      - name: Fetch the released mcpp
        timeout-minutes: 10
        run: bash .github/verify-634/setup-mcpp.sh
      - name: M5 - fresh-install launches, spawn of the installed executable, a crash
        timeout-minutes: 40
        run: bash .github/verify-634/macos-simctl-status.sh 2>&1
