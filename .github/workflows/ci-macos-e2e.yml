name: ci-macos-e2e

# The e2e suite on macOS ARM64, split out of ci-macos.yml (where it was 3.4 of
# the job's 8.4 min) so it runs in parallel with the toolchain/integration
# work — same shape as ci-linux-e2e.yml / ci-windows-e2e.yml.
#
# Not sharded: the macOS runners finish the suite in ~3.5 min, which is under
# this workflow's setup+build floor, so a second runner would buy nothing.
#
# Paired workflows: ci-macos.yml, ci-linux-e2e.yml, ci-windows-e2e.yml.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e suite (macOS ARM64, self-host, ${{ matrix.image }})
    # The same two images as ci-macos.yml; `xcode-27` is macOS 27 (see there).
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15, xcode-27]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    # NOTE: no MCPP_VERBOSE — the e2e suite asserts mcpp's default quiet
    # output (tests 48/53).
    steps:
      # `submodules: recursive` so tests/e2e/233_bench_matrix.sh can check that
      # each `hub`/`body` in bench/matrix.json exists in the tree it names --
      # the check reads "submodule not initialised" without them and reports
      # nothing, which is how a stale hub path survived (#599). Under 10 MB of
      # source across the three pins, and nothing here builds them.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos-llvm
        with:
          image: ${{ matrix.image }}

      - name: Build mcpp from source (self-host)
        run: |
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          "$MCPP" build

      - name: E2E suite
        # Fail-fast on hung tests instead of burning the whole job budget.
        # Per-test 600s timeout lives in run_all.sh.
        timeout-minutes: 25
        run: |
          # The RELEASED mcpp this job bootstrapped from, kept for e2e 252: the
          # claim that an older client can still build against a package the PR
          # produces is only worth making if something checks it against a real
          # old binary. Captured before $MCPP is repointed at the fresh build.
          export MCPP_BOOT="$MCPP"
          MCPP=$(find target -path "*/bin/mcpp" | head -1)
          MCPP=$(cd "$(dirname "$MCPP")" && pwd)/$(basename "$MCPP")
          test -x "$MCPP"
          export MCPP
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          test -x "$MCPP_VENDORED_XLINGS"
          export MCPP_E2E_TOOLCHAIN_MIRROR=GLOBAL
          "$MCPP" self config --mirror "$MCPP_E2E_TOOLCHAIN_MIRROR"
          "$MCPP" self config
          # macOS default toolchain is LLVM
          "$MCPP" toolchain default "llvm@${MCPP_LLVM_VER}"
          echo "MCPP=$MCPP" >> "$GITHUB_ENV"
          set -o pipefail
          bash tests/e2e/run_all.sh 2>&1 | tee "$RUNNER_TEMP/e2e-suite.log"

      # Measurement legs print READING lines and pass whatever they read; the
      # readings are what a decision is taken from (#646 F2: whether a C++
      # exception thrown in a dylib is caught by its class under the payload's
      # default runtime), so they are collected where a reader finds them.
      - name: Measurement readings
        if: always()
        shell: bash
        run: |
          {
            echo "### Measurement readings (macOS)"
            echo '```'
            grep -h '^READING' "$RUNNER_TEMP/e2e-suite.log" 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # #647 E3: an Android row links on a macOS host. Its own step, because the
      # NDK is a large download the suite's per-test bound does not allow for,
      # and the shard does not carry it (the script declares android-ndk).
      - name: "Android row on a macOS host (721)"
        timeout-minutes: 30
        shell: bash
        run: |
          set -o pipefail
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          export MCPP_E2E_TOOLCHAIN_MIRROR=GLOBAL
          "$MCPP" toolchain install android-ndk@30.0.16248370
          bash tests/e2e/721_*.sh 2>&1 | tee "$RUNNER_TEMP/721.log"
          grep -q '^PASS: 721' "$RUNNER_TEMP/721.log"
