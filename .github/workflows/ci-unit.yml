name: ci-unit

# THE UNIT AND C++ E2E TESTS OF ONE HOST, BUILT ONCE AND RUN IN SHARDS (design
# 2026-11-14). Called twice by ci.yml, as two stages:
#
#   archive  every test built once by the bootstrap mcpp (`mcpp test --no-run
#            --no-programs --archive`, SPEC-015 §4), with the measured history
#            of main's last run beside it: artifact `mcpp-unit-<host>`. The
#            package's program is not built here: the tests run build.yml's.
#            It needs no build of this commit, so it runs beside build.yml.
#   run      the host's gate, then the shards: each runs its part of the
#            archive (`mcpp test --archive --shard I/N --split auto`) against
#            this commit's mcpp as build.yml built it (MCPP_BIN_MCPP), the tests
#            assigned longest first by that one history, so the shards together
#            run each test once; a re-run of a failed shard runs what it failed.
#
# Measured on 2026-11-14 (Linux x86_64, GCC): the gate held the build job 18.6
# minutes after the binary was built, every Linux job waited for it, and the
# one job that then built and ran every test passed its 45-minute limit. In the
# archive stage the gate and the archive built the package's program again
# (1118 s of a 38.5-minute stage), and the shards tested that build.

on:
  workflow_call:
    inputs:
      stage:
        description: archive | run
        type: string
        required: true
      host:
        description: the host of build.yml's artifact (linux-x86_64)
        type: string
        required: true
      name:
        description: the host's name in the stores' artifact names (linux)
        type: string
        required: true
      runs-on:
        type: string
        required: true
      gate:
        description: the tests that must pass before the run goes on (build.yml `gate`)
        type: string
        default: e2e/basics
      tests:
        description: the tests written as `mcpp-tests-<host>` for the jobs that run named cases (e2e-cases)
        type: string
        default: ''
      shards:
        description: the run stage's shards, a JSON list of 1..N
        type: string
        default: '[1]'
      archived:
        description: the number of tests the archive stage built; 0 starts no shard
        type: string
        default: '1'
      cases:
        description: the run stage's cases of `mcpp-tests-<host>` that need the MinGW cross toolchain, one per line
        type: string
        default: ''
      select:
        description: the run stage's cases, one `mcpp test --case` pattern per line; empty for every case
        type: string
        default: ''
      jitter:
        description: the jitter of the run stage's shards, in milliseconds (jitter.yml); empty for none
        type: string
        default: ''
      jitter-seed:
        description: the seed of the jitter
        type: string
        default: ''
      form:
        description: the run stage's program under test, `host` or `release` (use-built-mcpp `form`)
        type: string
        default: host
      toolchains:
        description: >
          The toolchains the run stage's cases probe, installed before the shards run, separated
          by ';', each as `mcpp toolchain install` takes it (`llvm 23.1.3`); empty for none.
        type: string
        default: ''
    outputs:
      archived:
        description: the number of tests the archive holds
        value: ${{ jobs.archive.outputs.archived }}
      shards:
        description: the run stage's shards, from the shards of main's last run and the longest of them
        value: ${{ jobs.archive.outputs.shards }}

env:
  MCPP_HOME: /home/runner/.mcpp
  # Verbose every mcpp invocation for richer CI diagnostics (src/cli.cppm). The
  # e2e cases read mcpp's default output; the case support removes it.
  MCPP_VERBOSE: "1"

jobs:
  archive:
    name: unit tests, built (${{ inputs.host }})
    if: inputs.stage == 'archive'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    outputs:
      archived: ${{ steps.archive.outputs.archived }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bootstrap-mcpp

      # THE PACKAGE'S PROGRAM IS BUILD.YML'S. `--no-programs` (2026.11.13.1)
      # plans the package's programs for their names and neither builds nor
      # carries them; the run takes each from MCPP_BIN_<NAME>. A bootstrap
      # without the option builds and carries the program, as before it, and
      # the tests run that build of this commit's sources.
      - name: The archive's programs
        id: programs
        shell: bash
        run: |
          if "$MCPP" test --help 2>/dev/null | grep -q -- '--no-programs'; then
            echo "flag=--no-programs" >> "$GITHUB_OUTPUT"
          else
            echo "the bootstrap $("$MCPP" --version 2>/dev/null | head -1) builds the package's program into the archive"
          fi

      # MAIN'S TEST BUILD, REUSED (design 2026-11-14 §6, W1). The archive of
      # main's last successful run carries its build directory and the blob of
      # every tracked file it was built from. A file whose blob is the same is
      # given a time older than every output; a changed one keeps the
      # checkout's, so only what changed and what imports it is built again.
      # The bootstrap mcpp is pinned, so the configuration is main's; a pin
      # that moved builds whole, as a run without the artifact does.
      - name: Main's test build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ inputs.host }}
        run: |
          set -uo pipefail
          run=$(bash .github/tools/main_run.sh)  # main's, or the run it registered (design 2026-11-20 §5.22)
          [ -n "$run" ] || { echo "no successful run of main: the tests are built whole"; exit 0; }
          if ! gh run download "$run" -R "$GITHUB_REPOSITORY" -n "mcpp-unit-build-$HOST" -D "$RUNNER_TEMP/build" 2>/dev/null; then
            echo "main's run $run kept no test build for $HOST: the tests are built whole"; exit 0
          fi
          tar --zstd -xf "$RUNNER_TEMP/build/target.tar.zst" && rm -f "$RUNNER_TEMP/build/target.tar.zst"
          python3 .github/tools/source_mtimes.py restore target
          echo "main's run $run: its test build restored"

      # EVERY TEST, ON EVERY SET. The bootstrap mcpp that builds them selects
      # by change without the rule that a test running the package's program
      # is affected by the program's sources (2026.11.13.1), so it would leave
      # the e2e programs out of a pull request that changes src/; with that
      # rule nearly every change selects them all.
      - name: The tests, built once
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          mkdir -p "$RUNNER_TEMP/unit"
          # LINKS BOUNDED BY THE BOOTSTRAP'S SCHEDULE. Before 2026.11.16.1 a link
          # under the detached schedule (bmi_schedule = "on") took no permit, and
          # ninja ran six per compiler: a change every test links relinked the 26
          # tests at once, at 1 to 1.8 GB each, and the runner ran out of memory.
          # Such a bootstrap builds the archive with the ordinary schedule, whose
          # job count bounds links; a later one holds a permit for each link.
          v=$("$MCPP" --version 2>/dev/null | awk '{print $2; exit}')
          if [ "$(printf '%s\n' 2026.11.16.1 "$v" | sort -V | head -1)" != 2026.11.16.1 ]; then
            export MCPP_BMI_SCHEDULE=off
            echo "the bootstrap $v holds no permit for a link: the archive is built with bmi_schedule off"
          fi
          # shellcheck disable=SC2086 -- the flag is one word or none
          # The profile `ci` (mcpp.toml): -O0 and no debug information. The
          # default profile of this package is release (-O2); the tests built
          # with it took 8988 s of compiler time, and 4183 s with `ci`.
          "$MCPP" test --profile ci --no-run ${{ steps.programs.outputs.flag }} --archive "$RUNNER_TEMP/unit/unit.tar.gz" 2>&1 | tee "$RUNNER_TEMP/archive.log"
          n=$(sed -n 's/.*Archived \([0-9][0-9]*\) test.*/\1/p' "$RUNNER_TEMP/archive.log" | tail -1)
          [ -f "$RUNNER_TEMP/unit/unit.tar.gz" ] || n=0
          echo "archived=${n:-0}" >> "$GITHUB_OUTPUT"
          echo "the archive holds ${n:-0} test(s)"

      # One history for every shard: the shards of one run assign the tests
      # from it, so a run of main that finishes while they start changes none
      # of their assignments.
      - name: The measured history of main's last CI run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ inputs.name }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/unit/history"
          run=$(bash .github/tools/main_run.sh)  # main's, or the run it registered (design 2026-11-20 §5.22)
          if [ -z "$run" ]; then echo "no successful run of main: the shards divide by count"; exit 0; fi
          d="$RUNNER_TEMP/unit-stores"
          if ! gh run download "$run" -R "$GITHUB_REPOSITORY" -p "mtest-unit-$KEY*" -D "$d" 2>/dev/null; then
            echo "main's run $run kept no store for $KEY: the shards divide by count"; exit 0
          fi
          python3 .github/tools/test_history.py take "$RUNNER_TEMP/unit/history" "$d" "$d"/*/

      # THE SHARDS FROM THE PLAN (design 2026-11-20 §5.17, CI4): main's last run took N shards and
      # the longest of them W, so the run is N × W of shard time; this one takes as many shards as
      # that is in 30 minutes each, at least one, at most eight. N and W are read from the stores
      # the shard jobs kept (`mtest-unit-<name>-<shard>-a<attempt>`, each holding that shard's
      # runs, test_history.py): the store's import (test-report) keeps a run in the form of
      # mtest's records, which state no shard, and the subsystems' store beside them is another
      # job's. A shard's time is that of its longest programs and of those that
      # run beside one another, not its programs' durations over four workers: the openkal
      # programs build in parallel within the machine's one budget, and in fewer shards they run
      # beside one another and each takes longer. A run of three shards (1236, 834 and 1438 s)
      # gave two by its durations summed, and the two took 2544 and 2432 s, `trees` 1369 s in the
      # first run and past the 40 minutes it states in the second (CI, 2026-11-21). With no
      # history of shards, four.
      - name: The run stage's shards
        id: shards
        shell: bash
        env:
          KEY: ${{ inputs.name }}
        run: |
          set -uo pipefail
          # A re-run's store (`-a2`) holds the attempt before it and its `--failed` run: the
          # shards are counted by number, and the longest run is the whole shard's.
          was=0; longest=0
          for s in "$RUNNER_TEMP"/unit-stores/mtest-unit-"$KEY"-*-a*/; do
            [[ "$(basename "$s")" =~ ^mtest-unit-"$KEY"-([0-9]+)-a[0-9]+$ ]] || continue
            [ -f "$s/index.ndjson" ] || continue
            [ "${BASH_REMATCH[1]}" -le "$was" ] || was=${BASH_REMATCH[1]}
            ms=$(jq -s 'map(.ms // 0) | max // 0 | floor' "$s/index.ndjson" 2>/dev/null || echo 0)
            [ "${ms:-0}" -le "$longest" ] || longest=$ms
          done
          if [ "$was" -le 0 ] || [ "$longest" -le 0 ]; then
            echo 'shards=[1,2,3,4]' >> "$GITHUB_OUTPUT"; echo "no measured shards: four shards"; exit 0
          fi
          per=$((30 * 60 * 1000))
          n=$(( (was * longest + per - 1) / per ))
          [ "$n" -ge 1 ] || n=1
          [ "$n" -le 8 ] || n=8
          list=$(seq -s, 1 "$n")
          echo "shards=[$list]" >> "$GITHUB_OUTPUT"
          echo "main's last run: $was shard(s), the longest $((longest / 1000)) s: $n shard(s)"

      - name: Upload the tests and their history
        if: steps.archive.outputs.archived != '0'
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: mcpp-unit-${{ inputs.host }}
          path: ${{ runner.temp }}/unit
          if-no-files-found: error
          retention-days: 3

      # THE TEST BUILD FOR THE NEXT RUN: main's only, so a pull request
      # starts from the build of the branch it merges into.
      - name: Keep the test build
        id: keep
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.archive.outputs.archived != '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tools/source_mtimes.py record target
          tar --zstd -cf "$RUNNER_TEMP/target.tar.zst" target
          du -h "$RUNNER_TEMP/target.tar.zst"
      - name: Upload the test build
        if: steps.keep.outcome == 'success'
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: mcpp-unit-build-${{ inputs.host }}
          path: ${{ runner.temp }}/target.tar.zst
          compression-level: 0
          retention-days: 7

      # The tests a job that runs named cases takes (e2e-cases), built here
      # beside the others; the job names the program they test.
      - name: Write the tests other jobs run
        if: inputs.tests != ''
        shell: bash
        run: |
          set -euo pipefail
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          # shellcheck disable=SC2086 -- the input is a list of test paths
          "$MCPP" test ${{ inputs.tests }} --profile ci --no-run ${{ steps.programs.outputs.flag }} --archive "dist/mcpp-tests.tar.gz"

      - name: Upload the tests other jobs run
        if: inputs.tests != ''
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: mcpp-tests-${{ inputs.host }}
          path: dist/mcpp-tests.tar.gz
          if-no-files-found: error
          retention-days: 7

  shard:
    name: unit tests ${{ matrix.shard }}/${{ strategy.job-total }} (${{ inputs.host }}, self-host)
    if: inputs.stage == 'run' && inputs.archived != '0'
    runs-on: ${{ inputs.runs-on }}
    # The caller grants `actions: write`: a failed gate cancels the run. A job
    # of a called workflow that asks for more than its caller grants fails the
    # whole run at its start, the stage that does not run it included.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(inputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bootstrap-mcpp

      - uses: ./.github/actions/use-built-mcpp
        with:
          host: ${{ inputs.host }}
          form: ${{ inputs.form }}

      - name: The tests of this run
        uses: actions/download-artifact@v4
        with:
          name: mcpp-unit-${{ inputs.host }}
          path: ${{ runner.temp }}/unit

      # The program the tests run is this commit's, as build.yml built it or, in
      # ci.yml's `full` tier, as its release archive holds it: an archive
      # written with --no-programs takes it from MCPP_BIN_MCPP.
      - name: The program under test
        shell: bash
        run: |
          echo "MCPP_VENDORED_XLINGS=$XLINGS_BIN" >> "$GITHUB_ENV"
          echo "MCPP_BIN_MCPP=$MCPP" >> "$GITHUB_ENV"

      # THE TOOLCHAINS THE CASES PROBE, installed and not assumed (ci-linux-e2e.yml does the
      # same): the restored sandbox holds the ones build.yml's `prewarm` installed only while its
      # lineage is main's, and a case whose capability does not hold skips on every runner. On a
      # run that changed the xlings version, the fourteen cases that need llvm ran nowhere.
      # Warm runs install nothing.
      - name: The toolchains the cases probe
        if: inputs.toolchains != ''
        shell: bash
        run: |
          set -euo pipefail
          IFS=';' read -ra specs <<< "${{ inputs.toolchains }}"
          for spec in "${specs[@]}"; do
            spec="$(echo "$spec" | xargs)"
            [ -n "$spec" ] || continue
            echo "::group::mcpp toolchain install $spec"
            # shellcheck disable=SC2086 -- a spec is `<name> <version>`
            "$MCPP" toolchain install $spec
            echo "::endgroup::"
          done

      # THE HOST'S GATE (build.yml): a new program scaffolded, built and run by
      # this commit's mcpp, seconds of running, from the archive. A red commit
      # stops here, as the shards start, and the run is cancelled. The first
      # shard runs it; the gate's tests run again in their own shard.
      - name: The host's gate
        id: gate
        if: inputs.gate != '' && matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 -- the input is a list of test paths
          "$MCPP" test --archive "$RUNNER_TEMP/unit/unit.tar.gz" ${{ inputs.gate }}

      - name: A failed gate cancels the run
        if: ${{ failure() && steps.gate.outcome == 'failure' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::the gate of ${{ inputs.host }} failed: the run is cancelled"
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" \
            || echo "::warning::the run could not be cancelled (the token's actions permission)"

      # One history for every shard, taken after the gate: the gate's run is
      # not the shard's, and a record of it in the store would be the newest,
      # sizing this shard's tests unlike the others' and answering a re-run's
      # `--failed` in place of the attempt that failed.
      - name: The history the shards share
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/target/mtest"
          python3 .github/tools/test_history.py take target/mtest "$RUNNER_TEMP/unit/history"

      - name: Unit + integration tests via `mcpp test`
        uses: ./.github/actions/mcpp-unit
        with:
          name: ${{ inputs.name }}-${{ matrix.shard }}
          archive: ${{ runner.temp }}/unit/unit.tar.gz
          shard: ${{ matrix.shard }}/${{ strategy.job-total }}
          cases: ${{ inputs.select }}
          jitter: ${{ inputs.jitter }}
          jitter-seed: ${{ inputs.jitter-seed }}

      # A compiler that did not start is a state of the home, not of a test:
      # the loader its payload is bound through (<home>/registry/abi), the
      # generations of that link and what xlings did in the home, as they are
      # when a shard fails.
      - name: The home's runtime links and what xlings did, when a test failed
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          for home in "${MCPP_HOME:-$HOME/.mcpp}/registry" "$HOME/.xlings"; do
            echo "== $home"
            ls -la --time-style=full-iso "$home" | grep -i abi
            ls -la --time-style=full-iso "$home/abi/" "$home/abi.gen" 2>&1 | head -20
            for g in "$home"/abi.gen/*/; do echo "$g: $(find "$g" -type l | wc -l) links, $(find "$g" -xtype l | wc -l) dangling"; ls -la "$g"*/ld-* 2>&1 | head -4; done
            cat "$home/abi.json" 2>/dev/null
            echo "-- abi.ndjson"; cat "$home/logs/abi.ndjson" 2>/dev/null
            echo "-- payloads"; ls -ld --time-style=full-iso "$home"/data/xpkgs/*/* 2>/dev/null
            for b in xim-x-gcc/*/bin/g++ xim-x-binutils/*/bin/as xim-x-llvm/*/bin/clang; do
              for f in "$home"/data/xpkgs/$b; do [ -e "$f" ] && echo "$f: $(readelf -l "$f" 2>/dev/null | grep -o 'interpreter: [^]]*')"; done
            done
            echo "-- operations"; ls -la --time-style=full-iso "$home"/logs/ops/*/ 2>/dev/null | tail -80
            for f in "$home"/logs/ops/*/*.ndjson; do [ -f "$f" ] && { echo "## $f"; head -c 1500 "$f"; echo; }; done 2>/dev/null | head -c 60000
          done
          exit 0

  # The Windows cases only a job with the MinGW cross toolchain runs, from the
  # tests the archive stage wrote (no build here); each case is held to its
  # `ok` line, so a skip cannot pass as a run.
  cases:
    name: Windows cases from ${{ inputs.host }} (mingw-cross)
    if: inputs.stage == 'run' && inputs.cases != ''
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-mcpp
      - uses: ./.github/actions/use-built-mcpp
        with:
          host: ${{ inputs.host }}
          form: ${{ inputs.form }}
      # llvm beside it: the case that pairs clang with the MinGW payload reads
      # the program's resources with the payload's llvm-readobj (`llvm`).
      - name: Install mingw-cross toolchain
        shell: bash
        run: |
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          "$MCPP" toolchain install mingw-cross 16.2.0
          "$MCPP" toolchain install llvm 23.1.3
          echo "MCPP_VENDORED_XLINGS=$XLINGS_BIN" >> "$GITHUB_ENV"
      - uses: ./.github/actions/e2e-cases
        with:
          mcpp: ${{ env.MCPP }}
          under-test: ${{ env.MCPP }}
          host: ${{ inputs.host }}
          cases: ${{ inputs.cases }}
