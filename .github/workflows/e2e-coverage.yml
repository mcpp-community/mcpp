name: e2e-coverage

# The coverage map of the e2e suite (design 2026-11-08 W8; mtest's docs/coverage.md):
# mcpp built with GCC's arc counters ([profile.coverage]), the whole suite run
# by mtest under `--coverage`, and for each test the sources its run executed.
# A pull request's Linux shards read the last map (.github/actions/e2e-mtest)
# and run the tests whose runs executed a file the change touches, with the
# smoke and regression sets; a test the map does not know, a map older than
# mtest.toml's max_age, and a change mtest cannot read select every test. Main
# and releases run every test.

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  measure:
    name: e2e coverage (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      MCPP_HOME: /home/runner/.mcpp
      E2E_JOBS: '2'
      E2E_COVERAGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/bootstrap-mcpp
      - name: mcpp with arc counters
        run: |
          set -euo pipefail
          "$MCPP" build --profile coverage 2>&1 | tail -2
          bin=$(ls -t "$PWD"/target/*/*/bin/mcpp | head -1)
          dir=$(dirname "$(dirname "$bin")")
          echo "MCPP_COVERED=$bin" >> "$GITHUB_ENV"
          printf '\n[coverage]\nobjects  = "%s/obj"\ndatabase = "%s/compile_commands.json"\n' "$dir" "$dir" >> tests/e2e/mtest.toml
          tail -4 tests/e2e/mtest.toml
      - uses: ./.github/actions/e2e-mtest
        with:
          host: linux
      - name: The toolchains the suite probes
        timeout-minutes: 15
        run: |
          set -euo pipefail
          "$MCPP_COVERED" toolchain install gcc 16.1.0
          "$MCPP_COVERED" toolchain default gcc@16.1.0
          "$MCPP_COVERED" toolchain install gcc 16.1.0-musl
          "$MCPP_COVERED" toolchain install llvm 23.1.3
          "$MCPP_COVERED" toolchain install mingw-cross 16.1.0
          XLINGS_HOME="$MCPP_HOME/registry" "$XLINGS_BIN" install xim:nasm -y
          XLINGS_HOME="$MCPP_HOME/registry" "$XLINGS_BIN" install mcpplibs:cmdline@0.0.1 mcpplibs:cmdline@0.0.2 -y
      - name: The suite under --coverage
        timeout-minutes: 240
        run: |
          set -euo pipefail
          export MCPP="$MCPP_COVERED" MCPP_BOOT="$MCPP" MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          export MCPP_E2E_TOOLCHAIN_MIRROR=GLOBAL
          "$MCPP" self config
          bash tests/e2e/run_all.sh || true
          (cd tests/e2e && "$E2E_MTEST" coverage)
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-linux
          path: tests/e2e/.mtest/coverage.json
          include-hidden-files: true
          retention-days: 14
