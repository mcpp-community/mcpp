name: probe-770-771 (temporary, do not merge)

# TEMPORARY. Collects the measurements the design record
# .agents/docs/2026-10-05-std-module-pair-msvc-lto-and-export-discovery-design.md
# leaves open. Every other workflow is removed on this branch so only this runs.
# Nothing here asserts: each step prints, and the job summary carries the logs.

on:
  pull_request:
  workflow_dispatch:

jobs:
  msvc-facts:
    if: false   # measured in run 37290831503; not repeated
    name: cl.exe / link.exe / lib.exe facts (/GL, /bigobj, /LTCG)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: probe
        shell: bash
        run: |
          bash .github/probe/msvc_facts.sh 2>&1 | tee facts.log
          { echo '## msvc facts'; echo '```'; cat facts.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msvc-facts
          path: facts.log

  mcpp-probes:
    if: false   # measured in run 37291652508; not repeated
    name: mcpp (built from this commit) on #771, #770, #769
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MCPP_HOME: C:\Users\runneradmin\.mcpp
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-mcpp
      - name: Build mcpp from source
        shell: bash
        run: |
          set -euo pipefail
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          "$XLINGS_BIN" config --mirror GLOBAL 2>/dev/null || true
          "$MCPP" self config --mirror GLOBAL 2>/dev/null || true
          "$MCPP" build
          built=$(find target -type f -name mcpp.exe -path '*/bin/*' | head -1)
          mkdir -p dist && cp "$built" dist/mcpp.exe
          echo "MCPP_BUILT=$PWD/dist/mcpp.exe" >> "$GITHUB_ENV"
      - name: probe llvm row, plain environment (control)
        shell: bash
        run: |
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          bash .github/probe/mcpp_probes.sh llvm 2>&1 | tee probes-llvm-plain.log
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: probe cl.exe row (developer environment)
        shell: bash
        run: |
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          bash .github/probe/mcpp_probes.sh msvc 2>&1 | tee probes-msvc.log
      - name: probe llvm row, developer environment
        shell: bash
        run: |
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          bash .github/probe/mcpp_probes.sh llvm 2>&1 | tee probes-llvm-devenv.log
          cat probes-llvm-plain.log probes-msvc.log probes-llvm-devenv.log > probes.log
          { echo '## mcpp probes'; echo '```'; cat probes.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcpp-probes
          path: probes*.log

  codepage:
    name: O6 - Glob.EscapedSpellingIsUtf8WhateverTheName and the code page (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MCPP_HOME: C:\Users\runneradmin\.mcpp
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-mcpp
      - name: Build mcpp from source
        shell: bash
        run: |
          set -euo pipefail
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          "$XLINGS_BIN" config --mirror GLOBAL 2>/dev/null || true
          "$MCPP" self config --mirror GLOBAL 2>/dev/null || true
          "$MCPP" build
          built=$(find target -type f -name mcpp.exe -path '*/bin/*' | head -1)
          mkdir -p dist && cp "$built" dist/mcpp.exe
          echo "MCPP_BUILT=$PWD/dist/mcpp.exe" >> "$GITHUB_ENV"
      - name: probe
        shell: bash
        run: |
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          bash .github/probe/codepage.sh 2>&1 | tee codepage.log
          { echo '## code page'; echo '```'; cat codepage.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codepage
          path: codepage.log

  ws-profile:
    name: O7 - profiles, [workspace.build] and the rooted root (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-mcpp
      - name: Build mcpp from source
        shell: bash
        run: |
          set -euo pipefail
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          "$MCPP" build
          built=$(find target -type f -name mcpp -path '*/bin/*' | grep -v '/dist/' | head -1)
          mkdir -p dist && cp "$built" dist/mcpp
          echo "MCPP_BUILT=$PWD/dist/mcpp" >> "$GITHUB_ENV"
      - name: probe
        shell: bash
        run: |
          export MCPP_VENDORED_XLINGS="$XLINGS_BIN"
          bash .github/probe/ws_profile.sh 2>&1 | tee ws-profile.log
          { echo '## workspace profiles'; echo '```'; cat ws-profile.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ws-profile
          path: ws-profile.log
