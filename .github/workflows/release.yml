name: release

# The release of a tag: its four archives, promoted from the run that verified
# the tag's tree or built by release-build.yml (bootstrap mcpp from xlings,
# `mcpp pack --target x86_64-linux-musl`, xlings injected for install.sh
# consumers, smoke tests), then the release, its sealed manifest and the
# ecosystem's publication.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to (re)build — leave blank to derive `v<version>` from mcpp.toml and create the tag automatically'
        required: false
      canaries:
        description: 'build the ecosystem canaries (xlings, mcppls) with the candidate before the release is created'
        type: boolean
        default: false
      gitcode:
        description: 'also mirror the archives to GitCode (about 10 minutes per archive from a GitHub runner); off, the owner mirrors GitCode locally (docs/92-release.md)'
        type: boolean
        default: false

# THE BUILDS RUN AT ONCE, AND ONE JOB CREATES THE RELEASE (design 2026-11-14).
# The four platform builds start together and keep their archives as
# artifacts; `create-release` creates the GitHub release with every archive
# when all four have passed, so no release exists with a platform missing. The
# release v2026.11.12.1 took 109 minutes, its jobs one after another: the
# canaries 48, the Linux build 27 (it created the release the others waited
# for), the aarch64 build 29, the seal and the publication 5. The builds are
# release-build.yml's, which ci.yml's `full` tier runs too; a tree such a run
# verified is not built again (design 2026-11-20 §5.22): `find`, `promote`.
jobs:
  # THE ECOSYSTEM'S OWN PROJECTS, BUILT WITH THE CANDIDATE (the 2026-09-28
  # design, WS10; .github/release-canaries.toml), when the release is started
  # by hand with `canaries`. They gate the creation of the release, beside the
  # builds; a tag pushed creates its release without them. Each project's own
  # CI validates the release after it, pinning it.
  canaries:
    if: github.event_name == 'workflow_dispatch' && inputs.canaries
    uses: ./.github/workflows/release-canaries.yml

  # THE TAG'S TREE, AND THE RUN THAT VERIFIED IT (design 2026-11-20 §5.22, CI3). A `full` run of
  # ci.yml that passed left `verified-<tree>`, and its `release-form` job kept the four archives
  # this workflow would build (release-build.yml). When the tag's tree has that mark and the run's
  # archives are still kept, the release promotes them (`promote`): the archives a run tested are
  # the ones released. Otherwise it builds them (`build`), and the summary says which it did.
  find:
    name: the tag's tree and the run that verified it
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
      ref: ${{ steps.find.outputs.ref }}
      run: ${{ steps.find.outputs.run }}
    steps:
      # fetch-depth: 0 instead of fetch-tags: true — actions/checkout@v4
      # fails on push-tag triggers when both the ref'd tag and
      # `fetch-tags: true` are set:
      #   "Cannot fetch both <sha> and refs/tags/vX.Y.Z to refs/tags/vX.Y.Z"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Three trigger shapes converge here:
      #   1. push: refs/tags/vX.Y.Z   → that tag, at its commit
      #   2. workflow_dispatch with `tag`:
      #        - the tag exists → its commit (a rebuild)
      #        - it does not    → this run's commit; the release creates the tag there
      #   3. workflow_dispatch without `tag` → `v<version>` of mcpp.toml, as in 2.
      - name: The tag, its commit and tree, and the run that verified the tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            VER=$(awk -F '"' '/^version[[:space:]]*=/{print $2; exit}' mcpp.toml)
            test -n "$VER" || { echo 'failed to read [package].version from mcpp.toml'; exit 1; }
            TAG="v$VER"
          fi
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            REF=$(git rev-list -n 1 "refs/tags/$TAG")
          else
            REF="$GITHUB_SHA"
          fi
          TREE=$(git rev-parse "$REF^{tree}")
          RUN=$(gh api "repos/$REPO/actions/artifacts?name=verified-$TREE&per_page=5" \
                  --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty' 2>/dev/null || true)
          WHY=""
          if [ -n "$RUN" ]; then
            kept=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts?per_page=100" \
                     --jq '[.artifacts[] | select((.expired | not) and (.name | startswith("release-")))] | length')
            if [ "$kept" != 4 ]; then
              WHY="run $RUN verified the tree, and keeps $kept of its four archives"
              RUN=""
            fi
          else
            WHY="no run verified the tree"
          fi
          {
            echo "tag=$TAG"; echo "version=${TAG#v}"; echo "ref=$REF"; echo "run=$RUN"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## $TAG"
            echo "Commit \`$REF\`, tree \`$TREE\`."
            if [ -n "$RUN" ]; then
              echo "Promoted: the archives of run [$RUN](https://github.com/$REPO/actions/runs/$RUN), which verified the tree."
            else
              echo "Built: $WHY."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$TAG at $REF (tree $TREE): ${RUN:+promoted from run $RUN}${WHY:+built, $WHY}"

  build:
    needs: find
    if: ${{ needs.find.outputs.run == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.find.outputs.tag }}
      ref: ${{ needs.find.outputs.ref }}

  # The verified run's four archives, checked against their checksums and their version, kept as
  # this run's for `create-release`.
  promote:
    name: promote the verified run's archives
    needs: find
    if: ${{ needs.find.outputs.run != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    steps:
      - name: The archives, their checksums and their version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.find.outputs.run }}
          VERSION: ${{ needs.find.outputs.version }}
        run: |
          set -euo pipefail
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'release-*' -D promoted
          mkdir dist
          for dir in promoted/release-*/; do cp "$dir"* dist/; done
          cd dist
          for platform in linux-x86_64 linux-aarch64 macosx-arm64 windows-x86_64; do
            ls "mcpp-$VERSION-$platform".tar.gz "mcpp-$VERSION-$platform".zip 2>/dev/null | grep -q . || {
              echo "::error::run $RUN holds no archive of $VERSION for $platform"; ls -la; exit 1; }
          done
          for sum in *.sha256; do sha256sum -c "$sum"; done
          test -s RELEASE_NOTES.md && test -f install.sh && test -f mcpp.lua && test -f "mcpp-$VERSION.tar.gz"
          root=$(mktemp -d)
          tar -xzf "mcpp-$VERSION-linux-x86_64.tar.gz" -C "$root"
          ver=$(env -u MCPP_HOME "$root/mcpp-$VERSION-linux-x86_64/bin/mcpp" --version)
          echo "$ver"
          grep -qF "$VERSION" <<< "$ver" || { echo "::error::the promoted program reports $ver, not $VERSION"; exit 1; }
          ls -la

      - name: Keep the archives for the release
        uses: actions/upload-artifact@v4
        with:
          name: release-promoted
          if-no-files-found: error
          retention-days: 7
          path: dist/

  # Seal the complete, non-draft release inventory only after every platform
  # uploader has finished.  The manifest is desired state for downstream
  # reconcilers: a rerun may reproduce it byte-for-byte, but may never replace
  # it with different bytes for the same tag.
  # THE RELEASE, CREATED ONCE WITH EVERY ARCHIVE: after the four builds and,
  # when they ran, the canaries. SHA256SUMS names every archive of the
  # release, the four builds and the source.
  create-release:
    name: create the release
    needs: [canaries, find, build, promote]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # required to create releases + push tags
    timeout-minutes: 15
    steps:
      - name: The archives of the four builds, built or promoted
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS over every archive
        run: |
          set -euo pipefail
          cd dist
          ls mcpp-*.tar.gz mcpp-*.zip | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.find.outputs.tag }}
          name: ${{ needs.find.outputs.tag }}
          target_commitish: ${{ needs.find.outputs.ref }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/mcpp-*.tar.gz
            dist/mcpp-*.tar.gz.sha256
            dist/mcpp-*.zip
            dist/mcpp-*.zip.sha256
            dist/install.sh
            dist/SHA256SUMS
            dist/mcpp.lua

  # A job's default condition is that every job before it, transitively,
  # succeeded: the canaries, skipped in a release started without them, would
  # skip the seal and the publication after a release was created. Each states
  # the one job it follows (v2026.11.13.1 was created and not sealed).
  release-manifest:
    name: validate + seal release manifest
    needs: [create-release]
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable release identity
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            VERSION=$(awk -F '"' '/^version[[:space:]]*=/{print $2; exit}' mcpp.toml)
            test -n "$VERSION" || { echo 'failed to read [package].version from mcpp.toml'; exit 1; }
            TAG="v$VERSION"
          fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          COMMIT=$(git rev-list -n 1 "refs/tags/$TAG")
          test -n "$COMMIT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT"   >> "$GITHUB_OUTPUT"

      - name: Generate, upload once, and refetch manifest
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          VERSION="${{ steps.resolve.outputs.version }}"
          COMMIT="${{ steps.resolve.outputs.commit }}"
          AUDIT_ROOT=$(mktemp -d)
          mkdir -p "$AUDIT_ROOT/assets" "$AUDIT_ROOT/publish"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" \
            > "$AUDIT_ROOT/release.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$AUDIT_ROOT/assets"
          # SHA256SUMS names every archive of the release, the four builds
          # and the source: the Linux job wrote it before the others had
          # uploaded theirs, so it named Linux x86_64 alone.
          (cd "$AUDIT_ROOT/assets" && ls mcpp-*.tar.gz mcpp-*.zip 2>/dev/null | LC_ALL=C sort \
             | xargs sha256sum > "$AUDIT_ROOT/SHA256SUMS")
          cat "$AUDIT_ROOT/SHA256SUMS"
          if ! cmp -s "$AUDIT_ROOT/SHA256SUMS" "$AUDIT_ROOT/assets/SHA256SUMS"; then
            gh release upload "$TAG" "$AUDIT_ROOT/SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          fi
          python3 tools/release/generate_manifest.py \
            --release-json "$AUDIT_ROOT/release.json" \
            --assets-dir "$AUDIT_ROOT/assets" \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --output "$AUDIT_ROOT/publish/mcpp-release.json"

          if [ -f "$AUDIT_ROOT/assets/mcpp-release.json" ]; then
            cmp "$AUDIT_ROOT/assets/mcpp-release.json" \
                "$AUDIT_ROOT/publish/mcpp-release.json"
            echo "Existing manifest is byte-identical; leaving it untouched."
          else
            gh release upload "$TAG" \
              "$AUDIT_ROOT/publish/mcpp-release.json" \
              --repo "$GITHUB_REPOSITORY"
          fi

          # Do not trust the upload command alone. Fetch the final public
          # inventory into a clean directory, recompute every payload digest,
          # regenerate desired state, and compare the published bytes.
          MANIFEST_VISIBLE=false
          for attempt in {1..12}; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" \
                 --jq '.assets[].name' | grep -Fxq mcpp-release.json; then
              MANIFEST_VISIBLE=true
              break
            fi
            echo "Waiting for mcpp-release.json API visibility ($attempt/12)"
            sleep 5
          done
          test "$MANIFEST_VISIBLE" = true
          mkdir -p "$AUDIT_ROOT/final-assets"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" \
            > "$AUDIT_ROOT/final-release.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$AUDIT_ROOT/final-assets"
          test -f "$AUDIT_ROOT/final-assets/mcpp-release.json"
          python3 tools/release/generate_manifest.py \
            --release-json "$AUDIT_ROOT/final-release.json" \
            --assets-dir "$AUDIT_ROOT/final-assets" \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --output "$AUDIT_ROOT/final-expected.json"
          cmp "$AUDIT_ROOT/final-assets/mcpp-release.json" \
              "$AUDIT_ROOT/final-expected.json"
          cat "$AUDIT_ROOT/final-assets/mcpp-release.json"
          echo "SEALED_RELEASE_MANIFEST=$AUDIT_ROOT/final-assets/mcpp-release.json" >> "$GITHUB_ENV"

      # Downstream notifications consume the identity sealed by THIS run,
      # including workflow_dispatch rebuilds of a tag other than main's version.
      - name: Save the sealed manifest for package notifications
        uses: actions/upload-artifact@v4
        with:
          name: mcpp-release-manifest
          path: ${{ env.SEALED_RELEASE_MANIFEST }}
          if-no-files-found: error
          overwrite: true # A rerun has already proved the public bytes identical.
          retention-days: 30

  # PUBLISH THE RELEASE INTO THE XLINGS ECOSYSTEM (design 2026-11-14
  # release-publication, B1-B3), after every platform archive is in the release
  # and the manifest is sealed:
  #   1. mirror the archives to xlings-res/mcpp on GitHub (about a minute);
  #   2. open the index pull request on openxlings/xim-pkgindex from the sealed
  #      manifest (`index_pr.py`; seconds, no other repository's workflow);
  #   3. mirror GitCode, only when the run is dispatched with `gitcode`. A
  #      GitHub runner uploads there at about 0.012 MB/s: v2026.11.13.1 spent
  #      713 s on it, 604 s per archive. Without it the owner mirrors GitCode
  #      locally and merges the index pull request after that (docs/92-release.md).
  # A failed step keeps the workflow red; the steps before it stand.
  # Shared vendored scripts live in .github/tools/ (kept in sync with xlings).
  publish-ecosystem:
    needs: release-manifest
    if: ${{ !cancelled() && needs.release-manifest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      XLINGS_RES_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      XIM_PKGINDEX_TOKEN: ${{ secrets.XIM_PKGINDEX_TOKEN }}
      # A tag push has no inputs: `inputs.gitcode` is empty and GitCode is not mirrored.
      WITH_GITCODE: ${{ github.event_name == 'workflow_dispatch' && inputs.gitcode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: The sealed manifest
        uses: actions/download-artifact@v4
        with:
          name: mcpp-release-manifest
          path: sealed
      - name: Determine version
        id: version
        run: echo "version=$(python3 -c 'import json; print(json.load(open("sealed/mcpp-release.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Mirror the archives to xlings-res/mcpp on GitHub
        if: ${{ env.XLINGS_RES_TOKEN != '' }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
          MIRROR_HOSTS: gh
        run: |
          chmod +x .github/tools/mirror_res.sh
          bash .github/tools/mirror_res.sh mcpp "${{ steps.version.outputs.version }}"

      - name: Open the index pull request (xim-pkgindex)
        if: ${{ env.XIM_PKGINDEX_TOKEN != '' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.XIM_PKGINDEX_TOKEN }}
        run: |
          # The push of the index branch authenticates through gh.
          gh auth setup-git
          python3 .github/tools/index_pr.py --manifest sealed/mcpp-release.json \
            --gitcode "${{ env.WITH_GITCODE == 'true' && 'pending' || 'absent' }}"

      - name: Mirror the archives to GitCode
        if: ${{ env.XLINGS_RES_TOKEN != '' && env.WITH_GITCODE == 'true' }}
        # Longer than the script's own GitCode deadline (MIRROR_LEG_DEADLINE_GTC,
        # 2400 s), so the script reaches it and names what it abandoned.
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
          MIRROR_HOSTS: gtc
        run: |
          chmod +x .github/tools/gtc .github/tools/mirror_res.sh
          export PATH="$PWD/.github/tools:$PATH"
          bash .github/tools/mirror_res.sh mcpp "${{ steps.version.outputs.version }}"

      # Post-release verification (ci-fresh-install) is triggered via its
      # `workflow_run: [release]` hook — a platform-generated event that is
      # exempt from GITHUB_TOKEN trigger suppression and needs no cross-repo
      # PAT. (A PAT-based dispatch step lived here briefly; it never worked —
      # XIM_PKGINDEX_TOKEN's resource owner is the index org and cannot cover
      # this repository.)
