# Temporary recovery of the missing macOS artifact. Other platform archives remain unchanged.
# All original successful platform jobs are verified before the original manifest/mirror/index steps.
name: release
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing release tag to repair; this incident branch accepts only v2026.11.5.1
        required: true
        default: v2026.11.5.1
        type: choice
        options:
        - v2026.11.5.1
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: verify exact source and completed release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0
    - name: Immutable release source and preserved successful jobs
      run: "python3 - <<'CHECK'\nimport json, subprocess\nfrom pathlib import Path\nrun = json.loads(subprocess.check_output(['gh',\
        \ 'api', 'repos/mcpp-community/mcpp/actions/runs/41960453765'], text=True))\nassert run['head_sha'] == '1e6d1b3f9c68510af7d2d5b68bbf7aaef1a89e73'\n\
        jobs = json.loads(subprocess.check_output(['gh', 'api', 'repos/mcpp-community/mcpp/actions/runs/41960453765/jobs'],\
        \ text=True))['jobs']\nby_name = {j['name']: j for j in jobs}\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\
        \ == run['head_sha']\nfor name in ('canaries / canary xlings (ubuntu-24.04)', 'canaries / canary mcppls\
        \ (ubuntu-24.04)', 'build + upload (linux / x86_64)', 'build (Windows / x86_64)'):\n    assert by_name[name]['conclusion']\
        \ == 'success', (name, by_name[name]['status'])\nrelease=json.loads(subprocess.check_output(['gh','api','repos/mcpp-community/mcpp/releases/tags/v2026.11.5.1'],text=True))\n\
        assert not any('macosx-arm64' in a['name'] for a in release['assets']), 'Refuse to replace existing macOS\
        \ archive bytes'\nprint('Exact reviewed release source, both canaries and existing x64/Windows jobs verified;\
        \ macOS assets absent.')\nCHECK\n"
  build-macos:
    name: build (macOS / ARM64)
    runs-on: macos-15
    needs: source
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.tag }}
    - name: Resolve tag
      id: resolve
      run: "if [ \"${{ github.event_name }}\" = \"push\" ]; then\n  TAG=\"${{ github.ref_name }}\"\nelif [ -n \"\
        ${{ github.event.inputs.tag }}\" ]; then\n  TAG=\"${{ github.event.inputs.tag }}\"\nelse\n  VER=$(awk -F\
        \ '\"' '/^version[[:space:]]*=/{print $2; exit}' mcpp.toml)\n  TAG=\"v$VER\"\nfi\necho \"tag=$TAG\"    \
        \     >> \"$GITHUB_OUTPUT\"\necho \"version=${TAG#v}\" >> \"$GITHUB_OUTPUT\"\nif [ \"${{ github.event_name\
        \ }}\" = \"workflow_dispatch\" ] \\\n   && git rev-parse --verify \"refs/tags/$TAG\" >/dev/null 2>&1; then\n\
        \  git checkout --detach \"refs/tags/$TAG\"\nfi\n"
    - name: Cache xlings
      uses: actions/cache@v4
      with:
        path: ~/.xlings
        key: xlings-macos15-release-xl0462-${{ hashFiles('.xlings.json') }}
        restore-keys: 'xlings-macos15-release-xl0462-

          '
    - name: Bootstrap mcpp via xlings
      env:
        XLINGS_NON_INTERACTIVE: '1'
        XLINGS_VERSION: 2026.10.26.1
      run: "# By version, not by presence (see the Linux job).\nhave=$(\"$HOME/.xlings/subos/default/bin/xlings\"\
        \ --version 2>/dev/null | awk '{print $2}')\nif [ \"$have\" != \"$XLINGS_VERSION\" ]; then\n  WORK=$(mktemp\
        \ -d)\n  tarball=\"xlings-${XLINGS_VERSION}-macosx-arm64.tar.gz\"\n  bash \"$GITHUB_WORKSPACE/.github/tools/fetch_release.sh\"\
        \ \\\n    \"https://github.com/openxlings/xlings/releases/download/v${XLINGS_VERSION}/${tarball}\" \\\n\
        \    \"${WORK}/${tarball}\"\n  tar -xzf \"${WORK}/${tarball}\" -C \"${WORK}\"\n  \"${WORK}/xlings-${XLINGS_VERSION}-macosx-arm64/subos/default/bin/xlings\"\
        \ self install\nfi\nexport PATH=\"$HOME/.xlings/subos/default/bin:$PATH\"\nxlings --version\ntest \"$(xlings\
        \ --version | awk '{print $2}')\" = \"$XLINGS_VERSION\" || {\n  echo \"::error::the xlings this release\
        \ bundles is $(xlings --version), not $XLINGS_VERSION\"; exit 1; }\n# Pinned to .xlings.json \u2014 a bare\
        \ `xlings install mcpp` resolves\n# \"newest in this runner's index copy\" and put 0.0.105 (below the\n\
        # index floor) into this job. See .github/tools/install_pinned_mcpp.sh.\nMCPP=$(bash \"$GITHUB_WORKSPACE/.github/tools/install_pinned_mcpp.sh\"\
        \ \"$GITHUB_WORKSPACE\")\necho \"MCPP=$MCPP\" >> \"$GITHUB_ENV\"\necho \"XLINGS_BIN=$HOME/.xlings/subos/default/bin/xlings\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Build mcpp from source (two-stage self-host)
      env:
        MACOSX_DEPLOYMENT_TARGET: '14.0'
      run: "export PATH=\"$HOME/.xlings/subos/default/bin:$PATH\"\nexport MCPP_VENDORED_XLINGS=\"$XLINGS_BIN\"\n\
        \n# Stage 1: the bootstrap mcpp builds this release's source. The\n# bootstrap's macOS link path predates\
        \ the staticStdlib\n# implementation (hardcoded -lc++), so stage 1 links the system\n# libc++ \u2014 fine,\
        \ it only needs to RUN on this runner.\n\"$MCPP\" build\nSTAGE1=$(find target -path \"*/bin/mcpp\" | head\
        \ -1)\nSTAGE1=$(cd \"$(dirname \"$STAGE1\")\" && pwd)/$(basename \"$STAGE1\")\n# --no-cache removes target/,\
        \ including the stage-1 compiler. Ninja\n# invokes that compiler again for dependency scanning, so keep\
        \ the\n# bootstrap outside the tree the second stage is about to clear.\nSTAGE1_COPY=$(mktemp -d \"$RUNNER_TEMP/mcpp-stage1.XXXXXX\"\
        )/mcpp\ncp \"$STAGE1\" \"$STAGE1_COPY\"\nSTAGE1=\"$STAGE1_COPY\"\n\"$STAGE1\" --version\n\n# Stage 2: this\
        \ release's mcpp rebuilds itself \u2014 flags.cppm's\n# native staticStdlib link produces the static minos-14\
        \ binary.\n# NOTE: stage 2 lands in a NEW fingerprint directory (its\n# fingerprint includes the deployment\
        \ target; the bootstrap's\n# did not) \u2014 pick the most recently modified binary, not the\n# first find\
        \ hit.\n\"$STAGE1\" build --no-cache\nMCPP_BIN=$(ls -t $(find target -path \"*/bin/mcpp\" -type f) | head\
        \ -1)\nMCPP_BIN=$(cd \"$(dirname \"$MCPP_BIN\")\" && pwd)/$(basename \"$MCPP_BIN\")\ntest -x \"$MCPP_BIN\"\
        \nfile \"$MCPP_BIN\"\notool -L \"$MCPP_BIN\"\necho \"=== LC_BUILD_VERSION (must be minos 14.0) ===\"\notool\
        \ -l \"$MCPP_BIN\" | grep -A4 LC_BUILD_VERSION | head -6\notool -l \"$MCPP_BIN\" | grep -A4 LC_BUILD_VERSION\
        \ | grep -q \"minos 14.0\" \\\n  || { echo \"FAIL: expected minos 14.0\"; exit 1; }\nif otool -L \"$MCPP_BIN\"\
        \ | grep -q \"libc++\"; then\n  echo \"FAIL: still linked against system libc++\"; exit 1\nfi\n\"$MCPP_BIN\"\
        \ --version\necho \"MCPP_BIN=$MCPP_BIN\" >> \"$GITHUB_ENV\"\n"
    - name: Package macOS release
      id: stage
      run: "VERSION=\"${{ steps.resolve.outputs.version }}\"\nTARBALL_NAME=\"mcpp-${VERSION}-macosx-arm64.tar.gz\"\
        \nWRAPPER=\"mcpp-${VERSION}-macosx-arm64\"\n\n# Create release layout\nSTAGING=$(mktemp -d)\nmkdir -p \"\
        $STAGING/$WRAPPER/bin\"\ncp \"$MCPP_BIN\" \"$STAGING/$WRAPPER/bin/mcpp\"\n# Strip (Mach-O)\nstrip \"$STAGING/$WRAPPER/bin/mcpp\"\
        \ 2>/dev/null || true\n# Copy metadata\ncp LICENSE \"$STAGING/$WRAPPER/\" 2>/dev/null || true\ncp README.md\
        \ \"$STAGING/$WRAPPER/\" 2>/dev/null || true\n\n# Shell launcher (same as Linux)\ncat > \"$STAGING/$WRAPPER/mcpp\"\
        \ << 'LAUNCHER'\n#!/bin/sh\nexec \"$(dirname \"$0\")/bin/mcpp\" \"$@\"\nLAUNCHER\nchmod +x \"$STAGING/$WRAPPER/mcpp\"\
        \n\n# Bundle xlings for install.sh consumers\nXLINGS_BIN=\"$HOME/.xlings/subos/default/bin/xlings\"\nif\
        \ [ -x \"$XLINGS_BIN\" ]; then\n  mkdir -p \"$STAGING/$WRAPPER/registry/bin\"\n  cp \"$XLINGS_BIN\" \"$STAGING/$WRAPPER/registry/bin/xlings\"\
        \n  chmod +x \"$STAGING/$WRAPPER/registry/bin/xlings\"\nfi\n\n# Create tarball\nmkdir -p dist\n(cd \"$STAGING\"\
        \ && tar -czf \"$GITHUB_WORKSPACE/dist/${TARBALL_NAME}\" \"$WRAPPER\")\n# Versionless alias\ncp \"dist/${TARBALL_NAME}\"\
        \ \"dist/mcpp-macosx-arm64.tar.gz\"\n# SHA256\n(cd dist && shasum -a 256 \"${TARBALL_NAME}\" > \"${TARBALL_NAME}.sha256\"\
        )\n(cd dist && shasum -a 256 \"mcpp-macosx-arm64.tar.gz\" > \"mcpp-macosx-arm64.tar.gz.sha256\")\n\necho\
        \ \"tarball=${TARBALL_NAME}\" >> \"$GITHUB_OUTPUT\"\nls -la dist/\n"
    - name: Smoke-test the tarball
      run: 'VERSION="${{ steps.resolve.outputs.version }}"

        TARBALL_NAME="${{ steps.stage.outputs.tarball }}"

        WRAPPER="${TARBALL_NAME%.tar.gz}"

        SMOKE=$(mktemp -d)

        tar -xzf "dist/${TARBALL_NAME}" -C "$SMOKE"

        "$SMOKE/$WRAPPER/bin/mcpp" --version

        "$SMOKE/$WRAPPER/mcpp" --version | grep -q "$VERSION"

        # R4 (mcpp#832): stage 2 is this release''s own engine, and it trims

        # the paths the binary carries.

        bash .github/tools/check_release_paths.sh "$SMOKE/$WRAPPER/bin/mcpp"

        '
    - name: Upload macOS artifacts to release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.resolve.outputs.tag }}
        files: 'dist/mcpp-${{ steps.resolve.outputs.version }}-macosx-arm64.tar.gz

          dist/mcpp-${{ steps.resolve.outputs.version }}-macosx-arm64.tar.gz.sha256

          dist/mcpp-macosx-arm64.tar.gz

          dist/mcpp-macosx-arm64.tar.gz.sha256

          '
  release-manifest:
    name: validate + seal release manifest
    needs: build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.tag }}
    - name: Require all original successful platform jobs before sealing
      run: "python3 - <<'CHECK'\nimport json, subprocess\nfrom pathlib import Path\nrun = json.loads(subprocess.check_output(['gh',\
        \ 'api', 'repos/mcpp-community/mcpp/actions/runs/41960453765'], text=True))\nassert run['head_sha'] == '1e6d1b3f9c68510af7d2d5b68bbf7aaef1a89e73'\n\
        jobs = json.loads(subprocess.check_output(['gh', 'api', 'repos/mcpp-community/mcpp/actions/runs/41960453765/jobs'],\
        \ text=True))['jobs']\nby_name = {j['name']: j for j in jobs}\nfor name in ('canaries / canary xlings (ubuntu-24.04)',\
        \ 'canaries / canary mcppls (ubuntu-24.04)', 'build + upload (linux / x86_64)', 'build (linux / aarch64,\
        \ cross)', 'build (Windows / x86_64)'):\n    assert by_name[name]['status'] == 'completed' and by_name[name]['conclusion']\
        \ == 'success', (name, by_name[name]['status'], by_name[name]['conclusion'])\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==run['head_sha']\n\
        Path('release-recovery-evidence.json').write_text(json.dumps({'original_run':41960453765,'source':run['head_sha'],'original_jobs':jobs,'macos':'This\
        \ workflow needs the successful repaired native macOS build before this step.'},indent=2)+'\\n')\nprint('Both\
        \ original canaries and all three preserved platform jobs succeeded at the exact release source. Native\
        \ macOS repair succeeded in this workflow. Full immutable manifest validation follows.')\nCHECK\n"
    - name: Resolve immutable release identity
      id: resolve
      run: "if [ \"${{ github.event_name }}\" = \"push\" ]; then\n  TAG=\"${{ github.ref_name }}\"\nelif [ -n \"\
        ${{ github.event.inputs.tag }}\" ]; then\n  TAG=\"${{ github.event.inputs.tag }}\"\nelse\n  VERSION=$(awk\
        \ -F '\"' '/^version[[:space:]]*=/{print $2; exit}' mcpp.toml)\n  test -n \"$VERSION\" || { echo 'failed\
        \ to read [package].version from mcpp.toml'; exit 1; }\n  TAG=\"v$VERSION\"\nfi\ngit fetch --force origin\
        \ \"refs/tags/$TAG:refs/tags/$TAG\"\nCOMMIT=$(git rev-list -n 1 \"refs/tags/$TAG\")\ntest -n \"$COMMIT\"\
        \necho \"tag=$TAG\"         >> \"$GITHUB_OUTPUT\"\necho \"version=${TAG#v}\" >> \"$GITHUB_OUTPUT\"\necho\
        \ \"commit=$COMMIT\"   >> \"$GITHUB_OUTPUT\"\n"
    - name: Generate, upload once, and refetch manifest
      run: "TAG=\"${{ steps.resolve.outputs.tag }}\"\nVERSION=\"${{ steps.resolve.outputs.version }}\"\nCOMMIT=\"\
        ${{ steps.resolve.outputs.commit }}\"\nAUDIT_ROOT=$(mktemp -d)\nmkdir -p \"$AUDIT_ROOT/assets\" \"$AUDIT_ROOT/publish\"\
        \n\ngh api \"repos/${GITHUB_REPOSITORY}/releases/tags/$TAG\" \\\n  > \"$AUDIT_ROOT/release.json\"\ngh release\
        \ download \"$TAG\" --repo \"$GITHUB_REPOSITORY\" \\\n  --dir \"$AUDIT_ROOT/assets\"\n# SHA256SUMS names\
        \ every archive of the release, the four builds\n# and the source: the Linux job wrote it before the others\
        \ had\n# uploaded theirs, so it named Linux x86_64 alone.\n(cd \"$AUDIT_ROOT/assets\" && ls mcpp-*.tar.gz\
        \ mcpp-*.zip 2>/dev/null | LC_ALL=C sort \\\n   | xargs sha256sum > \"$AUDIT_ROOT/SHA256SUMS\")\ncat \"\
        $AUDIT_ROOT/SHA256SUMS\"\nif ! cmp -s \"$AUDIT_ROOT/SHA256SUMS\" \"$AUDIT_ROOT/assets/SHA256SUMS\"; then\n\
        \  gh release upload \"$TAG\" \"$AUDIT_ROOT/SHA256SUMS\" --clobber --repo \"$GITHUB_REPOSITORY\"\nfi\npython3\
        \ tools/release/generate_manifest.py \\\n  --release-json \"$AUDIT_ROOT/release.json\" \\\n  --assets-dir\
        \ \"$AUDIT_ROOT/assets\" \\\n  --version \"$VERSION\" \\\n  --tag \"$TAG\" \\\n  --commit \"$COMMIT\" \\\
        \n  --output \"$AUDIT_ROOT/publish/mcpp-release.json\"\n\nif [ -f \"$AUDIT_ROOT/assets/mcpp-release.json\"\
        \ ]; then\n  cmp \"$AUDIT_ROOT/assets/mcpp-release.json\" \\\n      \"$AUDIT_ROOT/publish/mcpp-release.json\"\
        \n  echo \"Existing manifest is byte-identical; leaving it untouched.\"\nelse\n  gh release upload \"$TAG\"\
        \ \\\n    \"$AUDIT_ROOT/publish/mcpp-release.json\" \\\n    --repo \"$GITHUB_REPOSITORY\"\nfi\n\n# Do not\
        \ trust the upload command alone. Fetch the final public\n# inventory into a clean directory, recompute\
        \ every payload digest,\n# regenerate desired state, and compare the published bytes.\nMANIFEST_VISIBLE=false\n\
        for attempt in {1..12}; do\n  if gh api \"repos/${GITHUB_REPOSITORY}/releases/tags/$TAG\" \\\n       --jq\
        \ '.assets[].name' | grep -Fxq mcpp-release.json; then\n    MANIFEST_VISIBLE=true\n    break\n  fi\n  echo\
        \ \"Waiting for mcpp-release.json API visibility ($attempt/12)\"\n  sleep 5\ndone\ntest \"$MANIFEST_VISIBLE\"\
        \ = true\nmkdir -p \"$AUDIT_ROOT/final-assets\"\ngh api \"repos/${GITHUB_REPOSITORY}/releases/tags/$TAG\"\
        \ \\\n  > \"$AUDIT_ROOT/final-release.json\"\ngh release download \"$TAG\" --repo \"$GITHUB_REPOSITORY\"\
        \ \\\n  --dir \"$AUDIT_ROOT/final-assets\"\ntest -f \"$AUDIT_ROOT/final-assets/mcpp-release.json\"\npython3\
        \ tools/release/generate_manifest.py \\\n  --release-json \"$AUDIT_ROOT/final-release.json\" \\\n  --assets-dir\
        \ \"$AUDIT_ROOT/final-assets\" \\\n  --version \"$VERSION\" \\\n  --tag \"$TAG\" \\\n  --commit \"$COMMIT\"\
        \ \\\n  --output \"$AUDIT_ROOT/final-expected.json\"\ncmp \"$AUDIT_ROOT/final-assets/mcpp-release.json\"\
        \ \\\n    \"$AUDIT_ROOT/final-expected.json\"\ncat \"$AUDIT_ROOT/final-assets/mcpp-release.json\"\necho\
        \ \"SEALED_RELEASE_MANIFEST=$AUDIT_ROOT/final-assets/mcpp-release.json\" >> \"$GITHUB_ENV\"\n"
    - name: Save the sealed manifest for package notifications
      uses: actions/upload-artifact@v4
      with:
        name: mcpp-release-manifest
        path: ${{ env.SEALED_RELEASE_MANIFEST }}
        if-no-files-found: error
        overwrite: true
        retention-days: 30
    - name: Save composed platform verification
      uses: actions/upload-artifact@v4
      with:
        name: mcpp-release-recovery-evidence
        path: release-recovery-evidence.json
        if-no-files-found: error
        retention-days: 30
  publish-ecosystem:
    needs: release-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XLINGS_RES_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      XIM_PKGINDEX_TOKEN: ${{ secrets.XIM_PKGINDEX_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0
    - name: Determine version
      id: version
      run: echo "version=$(awk -F '\"' '/^version[[:space:]]*=/{print $2; exit}' mcpp.toml)" >> "$GITHUB_OUTPUT"
    - name: Mirror binaries to xlings-res/mcpp (gh + gtc)
      if: ${{ env.XLINGS_RES_TOKEN != '' }}
      timeout-minutes: 45
      env:
        GH_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
      run: 'chmod +x .github/tools/gtc .github/tools/mirror_res.sh

        export PATH="$PWD/.github/tools:$PATH"

        # A4: BLOCKING. Both mirror hosts serve users (GLOBAL + CN install

        # paths); an incomplete mirror must fail here, visibly, instead of

        # surfacing as a 404 in the first user''s install (or fresh-install CI).

        bash .github/tools/mirror_res.sh mcpp "${{ steps.version.outputs.version }}"

        '
    - name: Open index bump PR (xim-pkgindex)
      if: ${{ env.XIM_PKGINDEX_TOKEN != '' }}
      env:
        PKGINDEX_TOKEN: ${{ secrets.XIM_PKGINDEX_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "chmod +x .github/tools/bump_index.sh\n# A4: BLOCKING \u2014 a missing bump PR means the index never\
        \ learns the\n# release exists and every post-release install of the new version 404s.\n# The index's own\
        \ updater writes the PR (bump_index.sh says why);\n# it needs the GitCode mirror above to be complete.\n\
        bash .github/tools/bump_index.sh mcpp \"${{ steps.version.outputs.version }}\"\n"
