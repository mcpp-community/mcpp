name: bootstrap-mcpp
description: >
  Restore the shared CI cache lineage (mcpp sandbox + xlings + target/) and
  bootstrap a released mcpp via xlings. Exports MCPP and XLINGS_BIN.

  Extracted so the split CI jobs (build / toolchain legs / e2e shards /
  integration) share ONE definition instead of copy-pasting a 40-line
  preamble per job. Every job that uses it lands on the same cache keys,
  which is what makes splitting cheap: each job restores a warm sandbox
  and only pays one incremental `mcpp build`.

inputs:
  xlings-version:
    description: xlings release to bootstrap from
    required: false
    # 0.4.69 is the floor the CURRENT index needs, not a routine bump. Its
    # SPEC-001 short-name migration put two packages named `lua` in one repo
    # (`compat:lua` and `mcpplibs.capi:lua`, both pulled in transitively by
    # mcpplibs.xpkg). Before 0.4.69 (openxlings/xlings#381) a repo keyed its
    # table by the bare `package.name`, so one of the two was simply
    # unreachable — and which one depended on the machine, which is why CI
    # failed on `compat:lua` on Windows and `mcpplibs.capi:lua` on Linux.
    default: '0.4.69'
  cache-target:
    description: also restore/save target/ (build artifacts + BMIs)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # NOTE: the "-ci-" segment keeps this lineage disjoint from release.yml's
    # "-release-" caches. A bare "mcpp-sandbox-<os>-" restore prefix used to
    # match the release sandbox too, silently swapping in a differently
    # populated registry (issue #120).
    - name: Cache mcpp sandbox
      uses: actions/cache@v4
      with:
        path: ~/.mcpp
        # The xlings version is part of the LINEAGE, not just the key: mcpp
        # vendors xlings into ~/.mcpp/registry/bin once at `self init` and
        # never revisits it (acquire_xlings_binary returns early when the file
        # exists). With the version only in the key, restore-keys would hand a
        # 0.4.30 sandbox to a 0.4.69 bootstrap and the sandbox — which is what
        # actually resolves dependencies — would silently stay behind.
        key: mcpp-sandbox-${{ runner.os }}-ci-xl${{ inputs.xlings-version }}-${{ hashFiles('mcpp.toml', '.xlings.json') }}
        restore-keys: |
          mcpp-sandbox-${{ runner.os }}-ci-xl${{ inputs.xlings-version }}-

    - name: Cache xlings
      uses: actions/cache@v4
      with:
        path: ~/.xlings
        key: xlings-${{ runner.os }}-v2-xl${{ inputs.xlings-version }}-${{ hashFiles('.xlings.json') }}
        restore-keys: |
          xlings-${{ runner.os }}-v2-xl${{ inputs.xlings-version }}-

    - name: Bootstrap mcpp via xlings (unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        XLINGS_NON_INTERACTIVE: '1'
        XLINGS_VERSION: ${{ inputs.xlings-version }}
      run: |
        REPO_DIR="$(pwd)"
        # Always install the pinned version — the cache may hold an older
        # xlings whose sysroot/packages are incompatible.
        case "$(uname -s)" in
          Darwin) tarball="xlings-${XLINGS_VERSION}-macosx-arm64.tar.gz" ;;
          *)      tarball="xlings-${XLINGS_VERSION}-linux-x86_64.tar.gz" ;;
        esac
        WORK=$(mktemp -d)
        curl -fsSL -o "${WORK}/${tarball}" \
          "https://github.com/d2learn/xlings/releases/download/v${XLINGS_VERSION}/${tarball}"
        tar -xzf "${WORK}/${tarball}" -C "${WORK}"
        "${WORK}/${tarball%.tar.gz}/subos/default/bin/xlings" self install
        export PATH="$HOME/.xlings/subos/default/bin:$PATH"
        echo "$HOME/.xlings/subos/default/bin" >> "$GITHUB_PATH"
        xlings --version
        # xim:mcpp — pinned, NOT bare `xlings install mcpp`.
        #
        # A bare install is idempotent, so on a cache hit it keeps whatever
        # version the cache already holds. `.xlings.json` only fed the cache
        # KEY, and `restore-keys` prefix-matches, so a stale sandbox got
        # restored and the pin was never applied: jobs ran 0.0.107 and 0.0.102
        # against an index whose floor was 0.0.108 (E0006). Warm caches hid it
        # — a cold one would have been a hard failure.
        # Absolute, POSIX-form path captured before any `cd`: the Windows leg
        # cds into the unpack dir and never returns, so a relative
        # `.xlings.json` resolves to nothing there — and GITHUB_WORKSPACE is a
        # backslash Windows path that git-bash tools mangle.
        XJSON="$REPO_DIR/.xlings.json"
        MCPP_PIN=$(grep -oE '"mcpp"[[:space:]]*:[[:space:]]*"[^"]+"' "$XJSON" \
                   | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        test -n "$MCPP_PIN" || { echo "FAIL: no mcpp pin in $XJSON"; exit 1; }
        echo "bootstrap pin: mcpp@${MCPP_PIN}"
        # Address the pinned version through ITS OWN version directory rather
        # than the shim in subos/default/bin (which is a symlink to xlings and
        # resolves to whatever version is currently selected — exactly the
        # drift this pin exists to prevent).
        #
        # Locate it by searching inside `xim-x-mcpp/<pin>/` instead of assuming
        # the layout underneath: it is `<ver>/mcpp` on Linux and `<ver>/bin/
        # mcpp.exe` on Windows, and the roots differ too. Anything found under
        # that directory IS the pinned version, so this keeps the guarantee
        # without hardcoding a shape that varies per platform.
        find_pinned_mcpp() {
          local d r
          for d in "$HOME/.xlings/data/xpkgs/xim-x-mcpp/${MCPP_PIN}" \
                   "$HOME/.xlings/subos/default/data/xpkgs/xim-x-mcpp/${MCPP_PIN}"; do
            [ -d "$d" ] || continue
            r=$(find "$d" -type f -name mcpp 2>/dev/null | head -1)
            [ -n "$r" ] && { echo "$r"; return 0; }
          done
          # Last resort: the roots above are the two layouts seen in practice,
          # but the VERSION DIRECTORY is the actual contract — find it wherever
          # xlings put it rather than fail on a layout we have not met yet.
          find "$HOME/.xlings" -type d -path "*xim-x-mcpp/${MCPP_PIN}" \
               -exec find {} -type f -name mcpp ';' 2>/dev/null | head -1
        }
        xlings install "mcpp@${MCPP_PIN}" -y || true
        MCPP=$(find_pinned_mcpp)
        if [ -z "$MCPP" ]; then
          # A restored ~/.xlings can carry a xim-pkgindex clone that predates
          # this release, and the refresh marker can read fresh while the clone
          # is behind. Refresh once and retry before calling it a failure.
          echo "pinned install did not land; refreshing the index and retrying"
          xlings update || true
          xlings install "mcpp@${MCPP_PIN}" -y || true
          MCPP=$(find_pinned_mcpp)
        fi
        test -n "$MCPP" || {
          echo "FAIL: no mcpp binary under xim-x-mcpp/${MCPP_PIN}"
          ls -d "$HOME"/.xlings/data/xpkgs/xim-x-mcpp/* \
                "$HOME"/.xlings/subos/default/data/xpkgs/xim-x-mcpp/* 2>/dev/null
          exit 1; }
        "$MCPP" --version
        # Compare the parsed version exactly: a substring match would let pin
        # 0.0.10 be satisfied by a 0.0.109 binary.
        MCPP_GOT=$("$MCPP" --version 2>/dev/null | head -1 \
                   | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        [ "$MCPP_GOT" = "$MCPP_PIN" ] || {
          echo "FAIL: mcpp at $MCPP reports '$MCPP_GOT', pin is '$MCPP_PIN'"; exit 1; }
        # The SANDBOX xlings is a separate copy: mcpp vendors it into
        # ~/.mcpp/registry/bin at `self init` and never revisits it
        # (acquire_xlings_binary returns early when the file exists), while
        # ~/.mcpp is restored from cache by prefix. So it can lag the system
        # one by a lot, and it — not the system binary — is what resolves
        # dependencies. Print both; a mismatch is worth seeing in the log.
        echo "system  xlings: $(xlings --version 2>/dev/null | head -1)"
        if [ -x "$HOME/.mcpp/registry/bin/xlings" ]; then
          echo "sandbox xlings: $("$HOME/.mcpp/registry/bin/xlings" --version 2>/dev/null | head -1)"
        else
          echo "sandbox xlings: (not initialised yet)"
        fi
        echo "MCPP=$MCPP" >> "$GITHUB_ENV"
        echo "XLINGS_BIN=$HOME/.xlings/subos/default/bin/xlings" >> "$GITHUB_ENV"

    - name: Bootstrap mcpp via xlings (windows)
      if: runner.os == 'Windows'
      shell: bash
      env:
        XLINGS_NON_INTERACTIVE: '1'
        XLINGS_VERSION: ${{ inputs.xlings-version }}
      run: |
        REPO_DIR="$(pwd)"
        WORK=$(mktemp -d)
        zipfile="xlings-${XLINGS_VERSION}-windows-x86_64.zip"
        curl -fsSL -o "${WORK}/${zipfile}" \
          "https://github.com/d2learn/xlings/releases/download/v${XLINGS_VERSION}/${zipfile}"
        cd "${WORK}"
        unzip -q "${zipfile}"
        "$WORK/xlings-${XLINGS_VERSION}-windows-x86_64/subos/default/bin/xlings.exe" self install
        export PATH="$USERPROFILE/.xlings/subos/default/bin:$PATH"
        echo "$USERPROFILE/.xlings/subos/default/bin" >> "$GITHUB_PATH"
        xlings.exe --version
        # Pinned install — see the unix leg for why a bare `install mcpp` let
        # the version drift behind the index floor unnoticed. The old `find |
        # head -1` here made it worse: with several versions in the sandbox it
        # returned whichever the directory walk hit first.
        # Absolute, POSIX-form path captured before any `cd`: the Windows leg
        # cds into the unpack dir and never returns, so a relative
        # `.xlings.json` resolves to nothing there — and GITHUB_WORKSPACE is a
        # backslash Windows path that git-bash tools mangle.
        XJSON="$REPO_DIR/.xlings.json"
        MCPP_PIN=$(grep -oE '"mcpp"[[:space:]]*:[[:space:]]*"[^"]+"' "$XJSON" \
                   | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        test -n "$MCPP_PIN" || { echo "FAIL: no mcpp pin in $XJSON"; exit 1; }
        echo "bootstrap pin: mcpp@${MCPP_PIN}"
        # Search inside the pinned version's own directory rather than assuming
        # the layout under it — see the unix leg.
        find_pinned_mcpp() {
          local d r
          for d in "$USERPROFILE/.xlings/subos/default/data/xpkgs/xim-x-mcpp/${MCPP_PIN}" \
                   "$USERPROFILE/.xlings/data/xpkgs/xim-x-mcpp/${MCPP_PIN}"; do
            [ -d "$d" ] || continue
            r=$(find "$d" -type f -name "mcpp.exe" 2>/dev/null | head -1)
            [ -n "$r" ] && { echo "$r"; return 0; }
          done
          find "$USERPROFILE/.xlings" -type d -path "*xim-x-mcpp/${MCPP_PIN}" \
               -exec find {} -type f -name "mcpp.exe" ';' 2>/dev/null | head -1
        }
        xlings.exe install "mcpp@${MCPP_PIN}" -y || true
        MCPP=$(find_pinned_mcpp)
        if [ -z "$MCPP" ]; then
          echo "pinned install did not land; refreshing the index and retrying"
          xlings.exe update || true
          xlings.exe install "mcpp@${MCPP_PIN}" -y || true
          MCPP=$(find_pinned_mcpp)
        fi
        test -n "$MCPP" || {
          echo "FAIL: no mcpp.exe under xim-x-mcpp/${MCPP_PIN}"
          ls -d "$USERPROFILE"/.xlings/subos/default/data/xpkgs/xim-x-mcpp/* \
                "$USERPROFILE"/.xlings/data/xpkgs/xim-x-mcpp/* 2>/dev/null
          exit 1; }
        "$MCPP" --version
        MCPP_GOT=$("$MCPP" --version 2>/dev/null | head -1 \
                   | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        [ "$MCPP_GOT" = "$MCPP_PIN" ] || {
          echo "FAIL: mcpp at $MCPP reports '$MCPP_GOT', pin is '$MCPP_PIN'"; exit 1; }
        # See the unix leg: the sandbox keeps its own vendored xlings copy.
        echo "system  xlings: $(xlings.exe --version 2>/dev/null | head -1)"
        if [ -x "$USERPROFILE/.mcpp/registry/bin/xlings.exe" ]; then
          echo "sandbox xlings: $("$USERPROFILE/.mcpp/registry/bin/xlings.exe" --version 2>/dev/null | head -1)"
        else
          echo "sandbox xlings: (not initialised yet)"
        fi
        echo "MCPP=$MCPP" >> "$GITHUB_ENV"
        echo "XLINGS_BIN=$(cygpath -w "$USERPROFILE/.xlings/subos/default/bin/xlings.exe")" >> "$GITHUB_ENV"

    # Precise key on src/ + manifest so a no-source-change run lands on a full
    # hit; layered restore-keys let partial hits keep BMI/dyndep state for a
    # proper incremental build.
    - name: Cache target/ (build artifacts + BMIs)
      if: inputs.cache-target == 'true'
      uses: actions/cache@v4
      with:
        path: target
        key: mcpp-target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('src/**', 'tests/**', 'mcpp.toml', 'mcpp.lock') }}
        restore-keys: |
          mcpp-target-${{ runner.os }}-${{ github.job }}-
          mcpp-target-${{ runner.os }}-
