# Release canaries (the 2026-09-28 ecosystem design, WS10).
#
# Projects of this ecosystem built with the candidate mcpp before a release is
# created: a release started by hand with `canaries` (release.yml) runs
# .github/workflows/release-canaries.yml beside its builds, and a canary that
# fails blocks the release. A tag pushed, or a release started without it,
# runs none (design 2026-11-14: their build took 48 of 109 minutes).
#
# Only the ecosystem's own repositories are canaries. A downstream project (a
# user's application, or a fork of one) validates a release in its own pull
# request after the release, pinning it; it does not gate mcpp's release.
#
# The candidate is built from the commit being released. A project's own pin
# of mcpp (`workspace.mcpp` in its `.xlings.json`) is removed in the project's
# checkout, so nothing installs the released mcpp in its place; nothing is
# committed to the project, and no override mechanism is added to xlings.
#
# Each entry: `repo` and `ref` to check out, the runner `os`, a `timeout` in
# minutes, the `commands` run in the checkout with `$MCPP` naming the
# candidate (each must exit 0; a command whose output must also say something
# pairs it with `expect`), and `cache` paths kept between runs.

[[canary]]
name     = "xlings"
repo     = "openxlings/xlings"
ref      = "main"
os       = "ubuntu-24.04"
timeout  = 60
commands = [
  "$MCPP build",
  "$MCPP test",
]

[[canary]]
name     = "mcppls"
repo     = "Sunrisepeak/mcpp-language-server"
ref      = "main"
os       = "ubuntu-24.04"
timeout  = 60
commands = [
  "$MCPP build",
  "$MCPP build -p devtools",
  "$MCPP test",
]
